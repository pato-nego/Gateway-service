spring:
  application:
    name: gateway

  cloud:
    gateway:

      metrics:
        enabled: true

      server:
        webflux:

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:8080}
                allowedHeaders: "*"
                allowedMethods: "*"
                allowCredentials: true

          routes:

            - id: insper-service
              uri: https://www.insper.edu.br
              predicates:
                - Path=/insper/**

            - id: account-service
              uri: http://account:8080
              predicates:
                - Path=/accounts/**

            - id: auth-service
              uri: http://auth:8080
              predicates:
                - Path=/auth/**

            - id: exchange-service
              uri: http://exchange:8000
              predicates:
                - Path=/exchange/**,/exchanges/**

            - id: product-service
              uri: ${PRODUCT_URL:http://product:8080}
              predicates:
                - Path=/products,/products/**

            - id: order-service
              uri: ${ORDER_URL:http://order:8080}
              predicates:
                - Path=/orders,/orders/**

management:
  endpoints:
    web:
      base-path: /gateway/actuator
      exposure:
        include: ['prometheus']

logging:
  level:
    root: info
    store: debug
    org.springframework.web: debug
