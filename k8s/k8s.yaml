apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  MANAGEMENT_SERVER_PORT: "9090"
  SERVER_SSL_ENABLED: 'true'
  SERVER_SSL_CERTIFICATE: /etc/gateway/tls/tls.crt
  SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /etc/gateway/tls/tls.key
  ACCOUNT_URL: http://account:8080
  ORDER_URL: http://order:8080
  PRODUCT_URL: http://product:8080
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-tls
type: kubernetes.io/tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: tls
        secret:
          secretName: gateway-tls
      containers:
      - name: gateway
        image: pato-nego/gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: tls
          mountPath: /etc/gateway/tls
          readOnly: true
        envFrom:
        - configMapRef:
            name: gateway-config
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            scheme: HTTPS
            path: /health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: https
    port: 443
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
